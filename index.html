<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Yes or No Wheel — Tabutility</title>
<meta name="description" content="Can't decide? Spin the Yes or No wheel for an instant answer. Customise the options and spin again."/>

<body>
<nav><span class="brand">⚡ Tabutility</span><a href="https://tabutility.com">← All Tools</a></nav>
<div class="ad-banner"><ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-7039091592734005" data-ad-slot="auto" data-ad-format="auto" data-full-width-responsive="true"></ins><script>(adsbygoogle=window.adsbygoogle||[]).push({});</script></div>
<div id="root"></div>
<script type="text/babel">
//<![CDATA[
const { useState, useRef, useEffect } = React;

const PRESETS = [
  { label: 'Yes / No', options: [{text:'YES',color:'#22c55e'},{text:'NO',color:'#ef4444'}] },
  { label: 'Yes / No / Maybe', options: [{text:'YES',color:'#22c55e'},{text:'NO',color:'#ef4444'},{text:'MAYBE',color:'#f59e0b'}] },
  { label: '50/50 (weighted)', options: [{text:'YES',color:'#22c55e'},{text:'YES',color:'#22c55e'},{text:'NO',color:'#ef4444'},{text:'NO',color:'#ef4444'}] },
];

function drawWheel(canvas, options, rotation) {
  const ctx = canvas.getContext('2d');
  const W = canvas.width; const H = canvas.height;
  const cx = W/2; const cy = H/2; const r = Math.min(cx,cy) - 8;
  ctx.clearRect(0,0,W,H);
  const n = options.length;
  const slice = (2 * Math.PI) / n;
  options.forEach((opt, i) => {
    const start = rotation + i * slice;
    const end = start + slice;
    ctx.beginPath(); ctx.moveTo(cx,cy);
    ctx.arc(cx,cy,r,start,end);
    ctx.closePath();
    ctx.fillStyle = opt.color; ctx.fill();
    ctx.strokeStyle = '#0f172a'; ctx.lineWidth = 3; ctx.stroke();
    ctx.save();
    ctx.translate(cx,cy);
    ctx.rotate(start + slice/2);
    ctx.textAlign = 'right';
    ctx.fillStyle = '#fff';
    ctx.font = `bold ${n <= 4 ? 28 : 20}px sans-serif`;
    ctx.fillText(opt.text, r - 16, 9);
    ctx.restore();
  });
  ctx.beginPath(); ctx.arc(cx,cy,18,0,2*Math.PI);
  ctx.fillStyle='#1e293b'; ctx.fill();
  ctx.strokeStyle='#475569'; ctx.lineWidth=2; ctx.stroke();
}

export default function YesOrNo() {
  const [presetIdx, setPresetIdx] = useState(0);
  const [options, setOptions] = useState(PRESETS[0].options);
  const [rotation, setRotation] = useState(0);
  const [spinning, setSpinning] = useState(false);
  const [result, setResult] = useState(null);
  const [history, setHistory] = useState([]);
  const canvasRef = useRef(null);
  const animRef = useRef(null);

  useEffect(() => {
    if (canvasRef.current) drawWheel(canvasRef.current, options, rotation);
  }, [options, rotation]);

  const spin = () => {
    if (spinning) return;
    setResult(null);
    const extra = 6 + Math.random() * 6;
    const extraAngle = Math.random() * 2 * Math.PI;
    const total = extra * 2 * Math.PI + extraAngle;
    const duration = 2800 + Math.random() * 800;
    const start = performance.now();
    const startRot = rotation;
    setSpinning(true);
    const animate = (now) => {
      const elapsed = now - start;
      const progress = Math.min(elapsed / duration, 1);
      const ease = 1 - Math.pow(1 - progress, 4);
      const cur = startRot + total * ease;
      setRotation(cur);
      if (progress < 1) {
        animRef.current = requestAnimationFrame(animate);
      } else {
        const n = options.length;
        const slice = (2 * Math.PI) / n;
        const norm = ((-(cur % (2*Math.PI))) + 2*Math.PI) % (2*Math.PI);
        const idx = Math.floor(norm / slice) % n;
        const r = options[idx];
        setResult(r);
        setHistory(h => [r, ...h.slice(0,9)]);
        setSpinning(false);
      }
    };
    animRef.current = requestAnimationFrame(animate);
  };

  const applyPreset = (i) => { setPresetIdx(i); setOptions(PRESETS[i].options); setResult(null); };

  return (
    <div style={{maxWidth:560,margin:'40px auto',padding:'0 20px'}}>
      <h1 style={{textAlign:'center',fontSize:28,fontWeight:700,marginBottom:8}}>Yes or No Wheel</h1>
      <p style={{textAlign:'center',color:'#94a3b8',marginBottom:24}}>Can't decide? Let the wheel choose for you.</p>

      <div style={{display:'flex',gap:8,justifyContent:'center',marginBottom:24,flexWrap:'wrap'}}>
        {PRESETS.map((p,i) => (
          <button key={i} onClick={()=>applyPreset(i)} style={{background:presetIdx===i?'#38bdf8':'#1e293b',color:presetIdx===i?'#0f172a':'#94a3b8',border:`1px solid ${presetIdx===i?'#38bdf8':'#334155'}`,borderRadius:10,padding:'8px 16px',fontSize:13,fontWeight:600,cursor:'pointer'}}>{p.label}</button>
        ))}
      </div>

      <div style={{background:'#1e293b',borderRadius:20,padding:'32px 24px',textAlign:'center',border:'1px solid #334155',marginBottom:20}}>
        <div style={{position:'relative',display:'inline-block',marginBottom:24}}>
          <canvas ref={canvasRef} width={300} height={300} style={{borderRadius:'50%',display:'block',cursor:'pointer'}} onClick={spin}/>
          {/* Right-pointing pointer */}
          <div style={{position:'absolute',top:'50%',right:-16,transform:'translateY(-50%)',width:0,height:0,borderTop:'16px solid transparent',borderBottom:'16px solid transparent',borderRight:'32px solid #f1f5f9'}}/>
        </div>

        {result && !spinning && (
          <div style={{background: result.color + '22', border:`2px solid ${result.color}`, borderRadius:14,padding:'16px 32px',marginBottom:16,display:'inline-block'}}>
            <div style={{fontSize:13,color:'#94a3b8',marginBottom:4}}>The wheel says…</div>
            <div style={{fontSize:44,fontWeight:900,color:result.color,letterSpacing:2}}>{result.text}</div>
          </div>
        )}

        <div style={{display:'block'}}>
          <button onClick={spin} disabled={spinning}
            style={{background:spinning?'#334155':'#38bdf8',color:spinning?'#64748b':'#0f172a',border:'none',borderRadius:12,padding:'14px 48px',fontSize:18,fontWeight:700,cursor:spinning?'not-allowed':'pointer'}}>
            {spinning ? 'Spinning…' : 'SPIN'}
          </button>
        </div>
      </div>

      {history.length > 0 && (
        <div style={{background:'#1e293b',borderRadius:16,padding:16,border:'1px solid #334155'}}>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:12}}>
            <h2 style={{fontSize:15,fontWeight:600}}>History</h2>
            <div style={{fontSize:13,color:'#64748b'}}>
              Yes: {history.filter(h=>h.text==='YES').length} / No: {history.filter(h=>h.text==='NO').length}
              {history.some(h=>h.text==='MAYBE') ? ` / Maybe: ${history.filter(h=>h.text==='MAYBE').length}` : ''}
            </div>
          </div>
          <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
            {history.map((h,i) => (
              <span key={i} style={{background:h.color+'22',color:h.color,border:`1px solid ${h.color}`,borderRadius:8,padding:'5px 14px',fontSize:14,fontWeight:700}}>{h.text}</span>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<YesOrNo />);
//]]>
</script>
</body>
</html>
